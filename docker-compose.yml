services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: filesharing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: api
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  postgres_data:
